# Ruff configuration for the plan-coder harness.
#
# The repository has no dependency manifest and no pyproject.toml, so this
# file provides the lint configuration that CI uses.
#
# Two rules govern this file:
#   * No blanket suppression.  There is no `ignore = ["ALL"]`, no global
#     per-rule `ignore`, and no directory-wide `exclude`.  The rule
#     selection below is explicit, and the per-file ignores enumerate only
#     the violations that already exist on the base commit
#     (23c1ac3) -- each one is annotated as pre-existing.
#   * No harness source is modified to satisfy the linter.  Every
#     pre-existing violation is listed here instead.
#
# `ruff check .` is green with this configuration; `ruff format --check .`
# still reports 18 pre-existing unformatted files, which are listed in the
# issue #4 report (reformatting the codebase is out of scope there).

[lint]
# Explicit rule selection: pyflakes + the pycodestyle subsets ruff enables
# by default, plus the handful of additional rules whose violations are
# enumerated per file below.
select = [
    "E4",      # pycodestyle: import, whitespace and indentation
    "E7",      # pycodestyle: statement-level rules (e.g. E741)
    "E9",      # pycodestyle: syntax/IO errors
    "F",       # pyflakes (F401 unused imports)
    "I001",    # isort: unsorted imports
    "B023",    # flake8-bugbear: function uses loop variable
    "UP017",   # pyupgrade: datetime.timezone.utc -> datetime.UTC
    "UP035",   # pyupgrade: deprecated import
    "SIM115",  # flake8-simplify: open() without a context manager
    "ISC004",  # flake8-implicit-str-concat: implicit concat in a literal
    "PLW1510", # pylint: subprocess.run without an explicit check
    "EXE001",  # flake8-executable: shebang without the executable bit
    "RUF100",  # ruff: unused noqa directive
    "RUF012",  # ruff: mutable class default
    "S112",    # flake8-bandit: try/except/continue
    "PIE810",  # flake8-pie: multiple starts/ends with a call
    "BLE001",  # flake8-blind-except: blind except
    "FURB122", # refurb: write to a loop variable instead of a slice
    "FURB188", # refurb: slice to remove a prefix/suffix
]

[lint.per-file-ignores]
